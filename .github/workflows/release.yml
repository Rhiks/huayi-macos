name: Preview Release

on:
  push:
    tags:
      - "v*-preview.*"

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build and verify universal preview package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-*}"
          chmod +x script/build_and_run.sh script/package_release.sh
          ./script/package_release.sh "$VERSION"

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/release/Huayi-*-universal.dmg \
            dist/release/Huayi-*-universal.zip \
            dist/release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Huayi $GITHUB_REF_NAME (Preview)" \
            --notes-file docs/PREVIEW_RELEASE.md
