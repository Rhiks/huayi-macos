name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - name: Build release
        run: swift build -c release
      - name: Run offline regression tests
        run: |
          BIN="$(swift build -c release --show-bin-path)/Huayi"
          "$BIN" --filter-self-test
          "$BIN" --routing-self-test
          "$BIN" --clipboard-self-test
